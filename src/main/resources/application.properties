spring.application.name=codingagent
server.port=${PORT:8060}

spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.base-url=https://api.clod.io
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=4000
#local ollama setup
#spring.ai.openai.base-url=http://localhost:11434
#spring.ai.openai.api-key=ollama
#spring.ai.openai.chat.options.model=llama3.2
#spring.ai.openai.chat.options.temperature=0.2
#spring.ai.openai.chat.options.max-tokens=4000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:exolveai}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Email provider: "smtp" for local, "resend" for production
mail.provider=${MAIL_PROVIDER:smtp}

# Resend config
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@resend.dev}

#Supabase config
#supabase.url=${SUPABASE_URL}
#supabase.api.key=${SUPABASE_API_KEY}
#supabase.bucket=${SUPABASE_BUCKET}

#Cloudnary config
cloudinary.cloud-name=${YOUR_CLOUD_NAME}
cloudinary.api-key=${YOUR_API_KEY}
cloudinary.api-secret=${YOUR_API_SECRET}

solver.output.dir=${PDF_OUTPUT_DIR:/tmp}

agent.system.prompt=You are a helpful coding assistant.

spring.profiles.active=local

# OCR settings ? path varies by OS, set via env var
ocr.tessdata-path=${OCR_TESSDATA_PATH}
ocr.languages=${OCR_LANGUAGES:eng}